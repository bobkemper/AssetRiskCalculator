<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Asset Tracker{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    {% include "partials/navbar.html" %}

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul class="flash">
        {% for msg in messages %}
        <li>{{ msg }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
