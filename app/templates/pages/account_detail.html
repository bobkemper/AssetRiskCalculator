{% extends "base.html" %}

{% block title %}Account{% endblock %}

{% block content %}
<h1>Transactions</h1>

<table class="table">
    <thead>
        <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
        </tr>
    </thead>
    <tbody>
        {% for t in transactions %}
        <tr>
            <td>{{ t.posted_date }}</td>
            <td>{{ t.description }}</td>
            <td class="amount">{{ t.amount }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3">No transactions</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
